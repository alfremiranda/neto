name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails the build on a high or critical advisory in what we ship or build
      # with. Runs before the build so a vulnerable tree never produces an
      # artifact. `--omit=dev` would hide build-time tooling, which is where
      # ours actually live, so it stays on the full tree.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      # Storybook ships inside the same artifact, at /storybook/. A design system whose
      # only viewer is a local dev server is one that only Dev can open — which is the
      # thing a living library exists to stop being true.
      #
      # After the app build on purpose: vite-plugin-pwa globs dist/ to build the service
      # worker's precache, so anything written afterwards cannot end up in it. globIgnores
      # and navigateFallbackDenylist cover it regardless, in case the order ever changes.
      - name: Build Storybook
        run: npx storybook build -o dist/storybook --quiet
        env:
          STORYBOOK_BASE: /storybook/
          STORYBOOK_DISABLE_TELEMETRY: '1'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
