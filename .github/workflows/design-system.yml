# Repo-side half of the design-system validator.
#
# Deliberately NOT part of deploy.yml. That workflow's gates (npm audit, tests) already
# froze production for seven commits once, silently, on an advisory nobody introduced.
# Design-system drift is a real defect but it is not a reason to stop shipping a bug fix
# to the user's phone, so this reports on its own and never holds the deploy.
#
# It also does not pretend to run the Figma audit: the T*/C* checks need the Plugin API
# and cannot run in CI at all (20-roadmap.md §0.4). Only R1-R4 live here.
name: Design system

on:
  push:
    branches: [main]
    paths: ['src/**', 'design-system/**', '.storybook/**', 'scripts/visual-regression.mjs', 'scripts/motion-rules.mjs', 'test/visual-baseline/**', '.github/workflows/design-system.yml']
  pull_request:
    paths: ['src/**', 'design-system/**', '.storybook/**', 'scripts/visual-regression.mjs', 'scripts/motion-rules.mjs', 'test/visual-baseline/**', '.github/workflows/design-system.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # build.py regenerates design-system/ so R2 can prove it is reproducible.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate
        run: node design-system/_build/validate-repo.mjs

  # Separate job: the repo validator needs no npm install, and a visual diff that has to
  # wait for one would discourage running it.
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 24, matching deploy.yml. On 22 the bundled npm 10 rejects a lockfile written by
      # npm 11 as "out of sync" even though package.json and the lock agree field for
      # field — verified by diffing them. Two workflows on two Node versions is a trap
      # that only shows up when one of them installs.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Screenshots differ between a Mac and a Linux runner — different font rasterisation,
      # not different CSS. The baseline is committed from CI's own renderer, so the compare
      # is like for like; a baseline taken locally would fail here on day one and the check
      # would be switched off within a week.
      - name: Visual regression
        run: node scripts/visual-regression.mjs

      # The two rules a screenshot cannot hold: which way the content travels, and what
      # survives prefers-reduced-motion. Both are behaviours over time.
      - name: Motion rules
        run: node scripts/motion-rules.mjs

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-diff
          path: test/visual-diff/
          retention-days: 7
